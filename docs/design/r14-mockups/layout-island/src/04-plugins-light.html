<!DOCTYPE html><html><head><meta charset=utf-8><style>*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,Roboto,"Noto Sans CJK SC",sans-serif;background:#F0F4FA;color:#1A2332;width:960px;height:640px;position:relative;overflow:hidden}
.stamp{position:absolute;right:14px;top:10px;font-size:12px;padding:3px 8px;border:1px solid #EF4444;color:#EF4444;border-radius:4px;background:#FFFFFF;z-index:20}

.island{background:#FFFFFF;border:1px solid #E2E8F2;border-radius:10px;box-shadow:0 2px 8px rgba(26,35,50,.08),0 1px 2px rgba(26,35,50,.06);padding:14px 16px}
.h{font-size:14px;font-weight:600;margin-bottom:10px}
.note{font-size:12px;color:#5A6B82}
.btn{display:inline-flex;align-items:center;justify-content:center;font:inherit;font-size:13px;font-weight:500;padding:5px 14px;border-radius:4px;border:1px solid transparent;line-height:1.6}
.bp{background:#2F6BFF;color:#fff}.bo{background:transparent;color:#2F6BFF;border-color:#2F6BFF66}
.chip{display:inline-flex;padding:4px 12px;border-radius:14px;border:1px solid #E2E8F2;font-size:12.5px;margin-right:6px}
.chip.on{background:#2F6BFF;color:#fff;border-color:#2F6BFF}
.tog{width:44px;height:24px;border-radius:12px;background:#E2E8F2;position:relative;display:inline-block;vertical-align:middle}
.tog.on{background:#2F6BFF}

.tog.on i{left:22px}
.row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid #E2E8F2;border-radius:6px;margin-bottom:6px;font-size:13px}
.listitem{padding:8px 10px;border-radius:6px;font-size:13px;color:#5A6B82}
.listitem.on{background:#E8F0FF;color:#2F6BFF;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid21{display:grid;grid-template-columns:240px 1fr;gap:14px;height:100%}
.input{flex:1;border:1px solid #E2E8F2;border-radius:4px;padding:7px 10px;font-size:13px;color:#5A6B82;background:transparent}
.src{padding:10px 12px;border:1px solid #E2E8F2;border-radius:6px;margin-bottom:8px}
.src.on{border-color:#2F6BFF;background:#E8F0FF}

</div></div></div><div class=legend>五 Tab 已定；合并：节点→订阅；规则→代理页内；链路→首页；诊断/连接/日志→设置·诊断</div></body></html>
