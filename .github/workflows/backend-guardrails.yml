name: Backend Guardrails

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/backend-guardrails.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  banned-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No Handle::refresh calls in feat
        run: '! grep -rn "Handle::refresh" src-tauri/src/feat'

      - name: No notice_message outside core/notify
        run: '! grep -rn "notice_message(" src-tauri/src --include="*.rs" | grep -v "core/notify"'

      - name: No manual update-flag chains
        run: '! grep -rnE "determine_update_flags|UpdateFlags" src-tauri/src'

      - name: Guard WebView policy and filesystem scopes
        run: |
          jq -e '.app.security.csp != null and .app.security.csp["worker-src"] != null and ([.app.security.assetProtocol.scope.allow[]?] | length > 0) and all(.app.security.assetProtocol.scope.allow[]?; . != "**")' src-tauri/tauri.conf.json
          jq -e '[.permissions[]? | select(type == "object" and .identifier == "fs:scope") | .allow[]? | select(. == "**")] | length == 0' src-tauri/capabilities/migrated.json
