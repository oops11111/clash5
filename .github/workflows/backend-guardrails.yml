name: Backend Guardrails

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/services/monaco.ts"
      - "scripts/check-webview-security.mjs"
      - "scripts/check-release-gates.mjs"
      - "scripts/check-privacy-defaults.mjs"
      - "RELEASE-GATES.md"
      - ".github/workflows/backend-guardrails.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  banned-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: WebView security boundaries
        run: node scripts/check-webview-security.mjs

      - name: Release registry integrity
        run: node scripts/check-release-gates.mjs

      - name: Privacy and installer-only update defaults
        run: node scripts/check-privacy-defaults.mjs

      - name: Backup path regression tests
        run: |
          rustc --edition 2024 --test src-tauri/src/feat/backup_path.rs -o /tmp/clash5-backup-path-tests
          /tmp/clash5-backup-path-tests

      - name: No Handle::refresh calls in feat
        run: '! grep -rn "Handle::refresh" src-tauri/src/feat'

      - name: No notice_message outside core/notify
        run: '! grep -rn "notice_message(" src-tauri/src --include="*.rs" | grep -v "core/notify"'

      - name: No manual update-flag chains
        run: '! grep -rnE "determine_update_flags|UpdateFlags" src-tauri/src'
