name: 问题反馈 / Bug report
title: '[BUG] '
description: 反馈你遇到的问题 / Report the issue you are experiencing
labels: ['bug']
type: 'Bug'

body:
  - type: markdown
    attributes:
      value: |
        ## 在提交问题之前，请确认以下事项：

        1. 请先查阅 [clash5 项目说明](https://github.com/oops11111/clash5#readme)。
        2. 请搜索 [clash5 已有问题](https://github.com/oops11111/clash5/issues)，避免重复提交。
        3. 请写明当前 clash5 版本、操作系统和可重复的复现步骤，并使用简洁标题。

        ## Before submitting the issue, please make sure of the following checklist:

        1. Read the [clash5 project overview](https://github.com/oops11111/clash5#readme).
        2. Search [existing clash5 issues](https://github.com/oops11111/clash5/issues) before filing a duplicate.
        3. Include the current clash5 version, operating system, reproducible steps, and a concise title.

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Describe the bug
      description: 详细清晰地描述你遇到的问题，并配合截图 / Describe the problem you encountered in detail and clearly, and provide screenshots
    validations:
      required: true
  - type: textarea
    attributes:
      label: 软件版本 / clash5 Version
      description: 请提供 clash5 的具体版本 / Please provide the exact clash5 version
      render: text
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤 / To Reproduce
      description: 请提供复现问题的步骤 / Steps to reproduce the behavior
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: 操作系统 / OS
      options:
        - label: Windows
        - label: Linux
        - label: MacOS
    validations:
      required: true
  - type: input
    attributes:
      label: 操作系统版本 / OS Version
      description: 请提供你的操作系统版本，Linux请额外提供桌面环境及窗口系统 / Please provide your OS version, for Linux, please also provide the desktop environment and window system
    validations:
      required: true
  - type: textarea
    attributes:
      label: 日志(勿上传日志文件，请粘贴日志内容) / Log (Do not upload the log file, paste the log content directly)
      description: 请提供完整或相关部分的Debug日志（请在“软件左侧菜单”->“设置”->“日志等级”调整到debug，Verge错误请把“杂项设置”->“app日志等级”调整到debug，并重启Verge生效。日志文件在“软件左侧菜单”->“设置”->“日志目录”下） / Please provide a complete or relevant part of the Debug log (please adjust the "Log level" to debug in "Software left menu" -> "Settings" -> "Log level". If there is a Verge error, please adjust "Miscellaneous settings" -> "app log level" to debug, and restart Verge to take effect. The log file is under "Software left menu" -> "Settings" -> "Log directory")
      placeholder: |
        请粘贴 clash5 日志中与问题相关的内容，并移除凭据。
        Paste relevant clash5 log entries here and remove credentials.
      render: log
    validations:
      required: true
