name: 功能请求 / Feature request
title: '[Feature] '
description: 提出你的功能请求 / Propose your feature request
labels: ['enhancement']
type: 'Feature'

body:
  - type: markdown
    attributes:
      value: |
        ## 在提交问题之前，请确认以下事项：
        1. 请先查阅 [clash5 项目说明](https://github.com/oops11111/clash5#readme) 和当前版本的功能。
        2. 请搜索 [clash5 已有问题](https://github.com/oops11111/clash5/issues)，避免重复提交。
        3. 请用简洁标题说明功能及使用场景。
        ## Before submitting the issue, please make sure of the following checklist:
        1. Read the [clash5 project overview](https://github.com/oops11111/clash5#readme) and check the current build.
        2. Search [existing clash5 issues](https://github.com/oops11111/clash5/issues) before filing a duplicate.
        3. Use a concise title and describe the feature's use case.

  - type: textarea
    id: description
    attributes:
      label: 功能描述 / Feature description
      description: 详细清晰地描述你的功能请求 / A clear and concise description of what the feature is
    validations:
      required: true
  - type: textarea
    attributes:
      label: 使用场景 / Use case
      description: 请描述你的功能请求的使用场景 / Please describe the use case of your feature request
    validations:
      required: true
  - type: checkboxes
    id: os-labels
    attributes:
      label: 适用系统 / Target OS
      description: 请选择该功能适用的操作系统（至少选择一个） / Please select the operating system(s) for this feature request (select at least one)
      options:
        - label: windows
        - label: macos
        - label: linux
    validations:
      required: true
