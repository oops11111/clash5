[package]
name = "clash5-data"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"

# Keep M0 tests independent of Tauri and its platform dependencies.
[workspace]

[dependencies]
idna = "=1.1.0"
hmac = "=0.13.0"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "=0.10.0"
sha2 = "=0.11.0"

[dev-dependencies]
tempfile = "=3.27.0"
